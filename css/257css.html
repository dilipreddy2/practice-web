<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS Team Management System</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#1e293b}
.wrap{max-width:1100px;margin:auto;padding:25px}
header{display:flex;justify-content:space-between;align-items:center}
.btn{background:#2563eb;color:white;border:0;padding:11px 18px;border-radius:8px}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:25px}
.card{background:white;padding:22px;border-radius:14px;box-shadow:0 4px 15px #0001}
.members{display:flex;margin:18px 0}
.member{width:42px;height:42px;border-radius:50%;background:#dbeafe;border:3px solid white;display:grid;place-items:center;margin-left:-8px}
.member:first-child{margin-left:0}
.role{color:#64748b}
@media(max-width:750px){.team{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.team{grid-template-columns:1fr}}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Team Management</h1><p>Organize teams and collaborate effectively.</p></div><button class="btn">Create Team</button></header>
<div class="team">
<div class="card"><h2>Engineering</h2><p class="role">Software Development</p><div class="members"><div class="member">AS</div><div class="member">PR</div><div class="member">RK</div><div class="member">+4</div></div><p>7 members</p></div>
<div class="card"><h2>Marketing</h2><p class="role">Marketing & Growth</p><div class="members"><div class="member">MK</div><div class="member">SJ</div><div class="member">+2</div></div><p>4 members</p></div>
<div class="card"><h2>Design</h2><p class="role">Product Design</p><div class="members"><div class="member">AN</div><div class="member">VP</div></div><p>2 members</p></div>
</div>
</div>
</body>
</html>

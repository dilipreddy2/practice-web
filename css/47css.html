<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Program 47 - Profile Card Component</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        .navbar {
            background-color: #1e293b;
            padding: 18px 40px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .container h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .container > p {
            text-align: center;
            color: #64748b;
            margin-bottom: 40px;
        }

        .profile-card {
            max-width: 380px;
            margin: auto;
            background-color: white;
            border-radius: 15px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .profile-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .cover {
            height: 120px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
        }

        .profile-image {
            width: 110px;
            height: 110px;
            margin: -55px auto 15px;
            border-radius: 50%;
            background-color: #2563eb;
            color: white;
            border: 5px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
        }

        .profile-card h2 {
            margin: 5px 0;
            color: #1e293b;
        }

        .role {
            color: #2563eb;
            font-weight: bold;
            margin: 8px 0;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
            padding: 0 30px;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 15px 25px;
        }

        .skill {
            background-color: #dbeafe;
            color: #1d4ed8;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            padding: 20px 25px 30px;
        }

        .button {
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
        }

        .primary {
            background-color: #2563eb;
            color: white;
        }

        .primary:hover {
            background-color: #1d4ed8;
        }

        .secondary {
            border: 1px solid #2563eb;
            color: #2563eb;
        }

        .secondary:hover {
            background-color: #eff6ff;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;
            }

            .container {
                margin: 30px auto;
                padding: 15px;
            }

            .profile-card {
                width: 100%;
            }

            .buttons {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
<style id="cloudflow-theme">:root{--text:#eef2ff;--muted:#a8b3cf;--accent:#7c5cff;--accent2:#22d3ee;--border:#2a3655}html{scroll-behavior:smooth}body{background:linear-gradient(135deg,#080c18,#101a31)!important;color:var(--text)!important;font-family:Inter,Segoe UI,Arial,sans-serif!important;line-height:1.6}h1,h2,h3,h4,h5,h6{color:var(--text)}p,li,label,small{color:var(--muted)}a{color:var(--accent2)}nav,.navbar,.top,header{background:rgba(8,12,24,.94)!important;color:var(--text)!important;border-color:var(--border)!important;backdrop-filter:blur(10px)}.logo{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text!important;-webkit-text-fill-color:transparent!important;color:var(--accent2)}button,.btn,.button,input[type=submit],input[type=button]{border-radius:10px;transition:.25s}button:hover,.btn:hover,.button:hover,input[type=submit]:hover,input[type=button]:hover{transform:translateY(-2px)}.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,.panel,.box,.content-box,.form-container,.contact-form,.profile-card,.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,.modal-content,.container-card,.plan,.table-container{background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;color:var(--text)!important;border-color:var(--border)!important;box-shadow:0 14px 35px rgba(0,0,0,.22)}input,textarea,select{background:#0e1528!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:8px}input::placeholder,textarea::placeholder{color:#71809f}table{border-color:var(--border)!important}th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}img{max-width:100%}.badge,.tag,.label{border-radius:999px}@media(max-width:700px){body{overflow-x:hidden}}</style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            CloudFlow
        </div>

    </nav>

    <div class="container">

        <h1>Profile Card Component</h1>

        <p>
            A simple profile card designed for a SaaS website.
        </p>

        <div class="profile-card">

            <div class="cover"></div>

            <div class="profile-image">
                S
            </div>

            <h2>Sanjana</h2>

            <div class="role">
                Web Developer
            </div>

            <p class="description">
                Passionate about creating modern and responsive
                websites using HTML, CSS, and JavaScript.
            </p>

            <div class="skills">

                <span class="skill">HTML</span>
                <span class="skill">CSS</span>
                <span class="skill">JavaScript</span>
                <span class="skill">UI Design</span>

            </div>

            <div class="buttons">

                <a href="#" class="button primary">
                    View Profile
                </a>

                <a href="#" class="button secondary">
                    Contact
                </a>

            </div>

        </div>

    </div>

</body>

</html>

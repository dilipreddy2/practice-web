<!DOCTYPE html>
<html>
<head>
    <title>User Avatars and Avatar Groups</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 850px;
            background-color: white;
            padding: 45px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #172554;
            margin-bottom: 12px;
        }

        .description {
            text-align: center;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .section {
            margin-bottom: 35px;
        }

        .section h2 {
            color: #334155;
            margin-bottom: 20px;
        }

        .avatars {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
        }

        .avatar-blue {
            background-color: #2563eb;
        }

        .avatar-green {
            background-color: #16a34a;
        }

        .avatar-purple {
            background-color: #7c3aed;
        }

        .avatar-orange {
            background-color: #ea580c;
        }

        .avatar-pink {
            background-color: #db2777;
        }

        .avatar-small {
            width: 45px;
            height: 45px;
            font-size: 14px;
        }

        .avatar-large {
            width: 90px;
            height: 90px;
            font-size: 28px;
        }

        .avatar-group {
            display: flex;
            align-items: center;
            padding-left: 12px;
        }

        .avatar-group .avatar {
            margin-left: -12px;
        }

        .more {
            background-color: #e2e8f0;
            color: #334155;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        .user-details h3 {
            color: #172554;
            margin-bottom: 5px;
        }

        .user-details p {
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
        }
    </style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>

<body>

    <div class="container">

        <h1>User Avatars and Avatar Groups</h1>

        <p class="description">
            Examples of individual user avatars and groups of
            avatars commonly used in modern web applications.
        </p>

        <div class="section">

            <h2>Individual User Avatars</h2>

            <div class="avatars">

                <div class="avatar avatar-blue">
                    AJ
                </div>

                <div class="avatar avatar-green">
                    SK
                </div>

                <div class="avatar avatar-purple">
                    RM
                </div>

                <div class="avatar avatar-orange">
                    JD
                </div>

                <div class="avatar avatar-pink">
                    AS
                </div>

            </div>

        </div>

        <div class="section">

            <h2>Different Avatar Sizes</h2>

            <div class="avatars">

                <div class="avatar avatar-small avatar-blue">
                    AB
                </div>

                <div class="avatar avatar-green">
                    CD
                </div>

                <div class="avatar avatar-large avatar-purple">
                    EF
                </div>

            </div>

        </div>

        <div class="section">

            <h2>Avatar Group</h2>

            <div class="avatar-group">

                <div class="avatar avatar-blue">
                    AJ
                </div>

                <div class="avatar avatar-green">
                    SK
                </div>

                <div class="avatar avatar-purple">
                    RM
                </div>

                <div class="avatar avatar-orange">
                    JD
                </div>

                <div class="avatar more">
                    +4
                </div>

            </div>

        </div>

        <div class="section">

            <h2>User Profile</h2>

            <div class="user-info">

                <div class="avatar avatar-large avatar-blue">
                    AS
                </div>

                <div class="user-details">
                    <h3>Alex Smith</h3>
                    <p>alex@example.com</p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Empty-State Component</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background-color: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: #172554;
            margin-bottom: 12px;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .empty-state {
            padding: 40px 25px;
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 12px;
        }

        .empty-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background-color: #dbeafe;
            color: #2563eb;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
        }

        .empty-state h2 {
            color: #334155;
            margin-bottom: 12px;
        }

        .empty-state p {
            max-width: 500px;
            margin: 0 auto 25px;
            color: #64748b;
            line-height: 1.6;
        }

        .action-button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 15px;
        }

        .action-button:hover {
            background-color: #1d4ed8;
        }

        .secondary-button {
            display: inline-block;
            padding: 12px 24px;
            margin-left: 8px;
            background-color: white;
            color: #334155;
            text-decoration: none;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        .secondary-button:hover {
            background-color: #f1f5f9;
        }

        .examples {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .example {
            padding: 12px 18px;
            background-color: #f1f5f9;
            border-radius: 8px;
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 20px;
            }

            .secondary-button {
                margin-left: 0;
                margin-top: 10px;
            }

            .empty-state {
                padding: 30px 18px;
            }
        }
    </style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>

<body>

    <div class="container">

        <h1>Empty-State Component</h1>

        <p class="description">
            An empty-state component informs users when there is
            no content or data available.
        </p>

        <div class="empty-state">

            <div class="empty-icon">
                📁
            </div>

            <h2>No Files Found</h2>

            <p>
                You do not have any files yet. Upload your first
                file to get started and manage your documents here.
            </p>

            <a href="#" class="action-button">
                Upload File
            </a>

            <a href="#" class="secondary-button">
                Learn More
            </a>

        </div>

        <div class="examples">

            <div class="example">
                No Search Results
            </div>

            <div class="example">
                No Messages
            </div>

            <div class="example">
                No Notifications
            </div>

        </div>

    </div>

</body>
</html>

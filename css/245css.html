<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>File Management</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f5f7fb;color:#111827}
header{
 background:white;padding:18px 5%;display:flex;
 justify-content:space-between;border-bottom:1px solid #e5e7eb
}
.container{width:90%;max-width:1100px;margin:35px auto}
.toolbar{
 display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap
}
button{
 background:#2563eb;color:white;border:0;
 padding:10px 15px;border-radius:7px;cursor:pointer
}
.files{
 display:grid;grid-template-columns:repeat(4,1fr);gap:18px
}
.file{
 background:white;padding:22px;border-radius:10px;
 border:1px solid #e5e7eb
}
.file-icon{
 font-size:35px;margin-bottom:15px
}
.file p{font-size:12px;color:#64748b}
@media(max-width:800px){
 .files{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){
 .files{grid-template-columns:1fr}
}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>

<body>

<header>
<h2>CloudDrive</h2>
<button onclick="upload()">Upload File</button>
</header>

<main class="container">

<h1>My Files</h1><br>

<div class="toolbar">
<button>All Files</button>
<button>Documents</button>
<button>Images</button>
<button>Spreadsheets</button>
</div>

<div class="files">

<div class="file">
<div class="file-icon">📄</div>
<h3>Project Report.pdf</h3>
<p>PDF • 2.4 MB</p>
</div>

<div class="file">
<div class="file-icon">📊</div>
<h3>Sales Data.xlsx</h3>
<p>Spreadsheet • 1.8 MB</p>
</div>

<div class="file">
<div class="file-icon">🖼️</div>
<h3>Dashboard.png</h3>
<p>Image • 850 KB</p>
</div>

<div class="file">
<div class="file-icon">📄</div>
<h3>Documentation.docx</h3>
<p>Document • 3.1 MB</p>
</div>

</div>

</main>

<script>
function upload(){
 alert("File upload dialog would open here.");
}
</script>

</body>
</html>

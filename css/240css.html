<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS Onboarding</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f5f7fb;color:#111827}
.container{width:min(700px,92%);margin:50px auto}
.card{background:white;padding:35px;border-radius:15px}
.progress{
 height:7px;background:#e5e7eb;border-radius:5px;margin:25px 0
}
.progress-bar{height:100%;background:#2563eb;width:33%;border-radius:5px}
.step{display:none}
.step.active{display:block}
.step h2{margin-bottom:10px}
.step p{color:#64748b;line-height:1.6}
input,select{
 width:100%;padding:12px;margin-top:8px;
 border:1px solid #d1d5db;border-radius:7px
}
label{display:block;margin:18px 0;font-size:13px;font-weight:bold}
.actions{display:flex;justify-content:space-between;margin-top:25px}
button{
 padding:11px 20px;border:0;border-radius:7px;
 background:#2563eb;color:white;cursor:pointer
}
.back{background:#e5e7eb;color:#374151}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>Welcome to CloudFlow</h1>

<div class="progress">
<div class="progress-bar" id="bar"></div>
</div>

<div class="step active">
<h2>1. Personal Information</h2>
<p>Tell us a little about yourself.</p>

<label>Name
<input id="name" placeholder="Your name">
</label>
</div>

<div class="step">
<h2>2. Workspace</h2>
<p>Set up your workspace.</p>

<label>Workspace Name
<input id="workspace" placeholder="My Workspace">
</label>

<label>Team Size
<select>
<option>1-5</option>
<option>6-20</option>
<option>21-50</option>
<option>50+</option>
</select>
</label>
</div>

<div class="step">
<h2>3. Finish</h2>
<p>Your workspace is ready to be created.</p>
</div>

<div class="actions">
<button class="back" id="back">Back</button>
<button id="next">Continue</button>
</div>

</div>
</div>

<script>
let current=0;
const steps=document.querySelectorAll(".step");
const bar=document.getElementById("bar");
const next=document.getElementById("next");
const back=document.getElementById("back");

function update(){
 steps.forEach((s,i)=>s.classList.toggle("active",i===current));
 bar.style.width=((current+1)/steps.length*100)+"%";
 back.style.visibility=current===0?"hidden":"visible";
 next.textContent=current===steps.length-1?"Finish":"Continue";
}

next.onclick=()=>{
 if(current<steps.length-1){
  current++;
  update();
 }else{
  alert("Onboarding completed!");
 }
};

back.onclick=()=>{
 if(current>0){
  current--;
  update();
 }
};

update();
</script>

</body>
</html>

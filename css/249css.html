<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS Login</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{
 margin:0;min-height:100vh;background:#eff6ff;
 display:flex;align-items:center;justify-content:center;padding:20px
}
.login{
 width:min(420px,100%);background:white;
 padding:40px;border-radius:15px;
 box-shadow:0 15px 40px #0001
}
.logo{text-align:center;color:#2563eb;font-size:25px;font-weight:bold}
h1{text-align:center;margin:25px 0 8px}
.subtitle{text-align:center;color:#64748b;font-size:13px}
label{display:block;margin-top:20px;font-size:13px;font-weight:bold}
input{
 width:100%;padding:12px;margin-top:7px;
 border:1px solid #d1d5db;border-radius:7px
}
.options{
 display:flex;justify-content:space-between;
 margin:15px 0;font-size:12px
}
a{color:#2563eb;text-decoration:none}
button{
 width:100%;padding:12px;border:0;border-radius:7px;
 background:#2563eb;color:white;font-weight:bold;cursor:pointer
}
.divider{
 display:flex;align-items:center;gap:10px;
 color:#94a3b8;font-size:11px;margin:25px 0
}
.divider:before,.divider:after{
 content:"";height:1px;background:#e5e7eb;flex:1
}
.social{
 display:grid;grid-template-columns:1fr 1fr;gap:10px
}
.social button{background:white;color:#374151;border:1px solid #d1d5db}
.signup{text-align:center;color:#64748b;font-size:13px;margin-top:25px}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>

<body>

<div class="login">

<div class="logo">CloudFlow</div>

<h1>Welcome Back</h1>
<p class="subtitle">Sign in to access your workspace.</p>

<form id="loginForm">

<label>Email Address</label>
<input type="email" id="email" placeholder="you@example.com" required>

<label>Password</label>
<input type="password" id="password" placeholder="Password" required>

<div class="options">
<label style="margin:0;font-weight:normal">
<input type="checkbox" style="width:auto">
 Remember me
</label>

<a href="#" onclick="forgot(event)">Forgot password?</a>
</div>

<button type="submit">Sign In</button>

</form>

<div class="divider">OR</div>

<div class="social">
<button onclick="social('Google')">Google</button>
<button onclick="social('Microsoft')">Microsoft</button>
</div>

<p class="signup">
Don't have an account?
<a href="#">Create one</a>
</p>

</div>

<script>
document.getElementById("loginForm").onsubmit=e=>{
 e.preventDefault();
 alert("Login submitted successfully.");
};

function forgot(e){
 e.preventDefault();
 alert("Password recovery selected.");
}

function social(name){
 alert("Continue with "+name);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Program 51 - SaaS Statistics Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }

        .navbar {
            background-color: #1e293b;
            padding: 18px 40px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .container h1 {
            text-align: center;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .container > p {
            text-align: center;
            color: #64748b;
            margin-bottom: 40px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .stat-card {
            background-color: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #dbeafe;
            border-radius: 10px;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .stat-title {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .stat-change {
            font-size: 14px;
            font-weight: bold;
        }

        .positive {
            color: #16a34a;
        }

        .negative {
            color: #dc2626;
        }

        .neutral {
            color: #2563eb;
        }

        @media (max-width: 900px) {
            .stats-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            .navbar {
                padding: 15px 20px;
            }

            .container {
                margin: 30px auto;
                padding: 15px;
            }

            .stats-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
<style id="cloudflow-theme">:root{--text:#eef2ff;--muted:#a8b3cf;--accent:#7c5cff;--accent2:#22d3ee;--border:#2a3655}html{scroll-behavior:smooth}body{background:linear-gradient(135deg,#080c18,#101a31)!important;color:var(--text)!important;font-family:Inter,Segoe UI,Arial,sans-serif!important;line-height:1.6}h1,h2,h3,h4,h5,h6{color:var(--text)}p,li,label,small{color:var(--muted)}a{color:var(--accent2)}nav,.navbar,.top,header{background:rgba(8,12,24,.94)!important;color:var(--text)!important;border-color:var(--border)!important;backdrop-filter:blur(10px)}.logo{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text!important;-webkit-text-fill-color:transparent!important;color:var(--accent2)}button,.btn,.button,input[type=submit],input[type=button]{border-radius:10px;transition:.25s}button:hover,.btn:hover,.button:hover,input[type=submit]:hover,input[type=button]:hover{transform:translateY(-2px)}.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,.panel,.box,.content-box,.form-container,.contact-form,.profile-card,.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,.modal-content,.container-card,.plan,.table-container{background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;color:var(--text)!important;border-color:var(--border)!important;box-shadow:0 14px 35px rgba(0,0,0,.22)}input,textarea,select{background:#0e1528!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:8px}input::placeholder,textarea::placeholder{color:#71809f}table{border-color:var(--border)!important}th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}img{max-width:100%}.badge,.tag,.label{border-radius:999px}@media(max-width:700px){body{overflow-x:hidden}}</style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">
            CloudFlow
        </div>
    </nav>

    <div class="container">

        <h1>SaaS Statistics</h1>

        <p>
            Overview of important statistics for your SaaS platform.
        </p>

        <div class="stats-container">

            <div class="stat-card">

                <div class="stat-icon">
                    👥
                </div>

                <div class="stat-title">
                    Total Users
                </div>

                <div class="stat-value">
                    12,540
                </div>

                <div class="stat-change positive">
                    ↑ 12.5% this month
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    💰
                </div>

                <div class="stat-title">
                    Monthly Revenue
                </div>

                <div class="stat-value">
                    ₹8.4L
                </div>

                <div class="stat-change positive">
                    ↑ 8.2% this month
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📊
                </div>

                <div class="stat-title">
                    Active Projects
                </div>

                <div class="stat-value">
                    486
                </div>

                <div class="stat-change neutral">
                    → 3.4% growth
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    ⚡
                </div>

                <div class="stat-title">
                    Churn Rate
                </div>

                <div class="stat-value">
                    2.4%
                </div>

                <div class="stat-change negative">
                    ↓ 0.8% this month
                </div>

            </div>

        </div>

    </div>

</body>

</html>

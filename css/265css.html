<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS Help Center</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f7f9fc;color:#1e293b}
.hero{background:#2563eb;color:white;text-align:center;padding:55px 20px}
.search{width:min(650px,90%);padding:16px;border:0;border-radius:9px;margin-top:20px;font-size:16px}
.wrap{max-width:1000px;margin:35px auto;padding:20px}
.categories{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:white;padding:22px;border-radius:12px;box-shadow:0 3px 14px #0001}
.card a{color:#2563eb;text-decoration:none;display:block;margin:9px 0}
@media(max-width:700px){.categories{grid-template-columns:1fr}}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>
<body>
<div class="hero">
<h1>How can we help?</h1>
<p>Search our help center for answers.</p>
<input class="search" placeholder="Search articles...">
</div>
<div class="wrap">
<div class="categories">
<div class="card">
<h2>🚀 Getting Started</h2>
<a href="#">Create your account</a>
<a href="#">Set up your workspace</a>
<a href="#">Invite your team</a>
</div>
<div class="card">
<h2>⚙ Account</h2>
<a href="#">Account settings</a>
<a href="#">Security</a>
<a href="#">Billing</a>
</div>
<div class="card">
<h2>📊 Analytics</h2>
<a href="#">Dashboard guide</a>
<a href="#">Reports</a>
<a href="#">Data exports</a>
</div>
</div>
</div>
</body>
</html>

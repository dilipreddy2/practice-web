<!DOCTYPE html>
<html>
<head>
<title>Anomaly Detection Dashboard</title>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
    .page{max-width:1100px;margin:auto;padding:30px}
    header{background:#0f172a;color:white;padding:25px;border-radius:12px;margin-bottom:25px}
    header h1{font-size:27px;margin-bottom:8px}
    header p{color:#cbd5e1;line-height:1.5}
    .panel,.card,.chat,.form,.tablebox,.workflow,.profile,.settings,.queue,.timeline,.approval,.builder,.sources,.explain{
        background:white;padding:25px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)
    }
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .card h3{margin-bottom:12px}
    .card p{color:#64748b;line-height:1.5}
    button{border:0;background:#2563eb;color:white;padding:11px 16px;border-radius:7px;cursor:pointer}
    button:hover{background:#1d4ed8}
    input,textarea,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px}
    label{display:grid;gap:7px;font-weight:bold}
    .form{display:grid;gap:17px}
    .badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#dbeafe;color:#1d4ed8;font-size:13px}
    .positive{color:#16a34a;font-weight:bold}
    .warning{color:#d97706;font-weight:bold}
    .danger{color:#dc2626;font-weight:bold}
    .muted{color:#64748b}
    .bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-top:8px}
    .bar span{display:block;height:100%;background:#2563eb;border-radius:10px}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:13px;border-bottom:1px solid #e2e8f0}
    th{color:#475569}
    @media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
    @media(max-width:550px){.page{padding:15px}.grid{grid-template-columns:1fr}header h1{font-size:22px}}
    </style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>
<body>
<main class="page">
<header>
<h1>Anomaly Detection Dashboard</h1>
<p>A dashboard for identifying unusual data patterns.</p>
</header>
<div class="grid"><div class="card"><span class="badge">Normal</span><h3>Traffic</h3><p>Expected activity detected.</p></div><div class="card"><span class="badge" style="background:#fee2e2;color:#b91c1c">Anomaly</span><h3>Revenue</h3><p class="danger">Unusual 42% increase detected.</p></div><div class="card"><span class="badge">Normal</span><h3>Signups</h3><p>Activity is within expected range.</p></div></div>
</main>
</body>
</html>

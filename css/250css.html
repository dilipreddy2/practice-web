<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS Signup</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{
 margin:0;min-height:100vh;background:#f1f5f9;
 display:flex;align-items:center;justify-content:center;padding:20px
}
.signup{
 width:min(480px,100%);background:white;
 padding:38px;border-radius:15px;
 box-shadow:0 15px 40px #0001
}
.logo{text-align:center;color:#2563eb;font-size:25px;font-weight:bold}
h1{text-align:center;margin:22px 0 8px}
.subtitle{text-align:center;color:#64748b;font-size:13px;margin-bottom:25px}
label{display:block;font-size:13px;font-weight:bold;margin:15px 0 6px}
input{
 width:100%;padding:12px;border:1px solid #d1d5db;
 border-radius:7px;outline:none
}
input:focus{border-color:#2563eb}
.password-meter{
 height:5px;background:#e5e7eb;border-radius:5px;
 margin-top:7px;overflow:hidden
}
.meter{height:100%;width:0;background:#16a34a;transition:.2s}
.terms{
 display:flex;gap:8px;font-size:12px;color:#64748b;
 margin:18px 0
}
.terms input{width:auto}
button{
 width:100%;padding:12px;border:0;border-radius:7px;
 background:#2563eb;color:white;font-weight:bold;cursor:pointer
}
.login{text-align:center;color:#64748b;font-size:13px;margin-top:20px}
a{color:#2563eb;text-decoration:none}
.error{color:#dc2626;font-size:12px;margin-top:8px}
.success{
 background:#dcfce7;color:#166534;padding:10px;
 border-radius:7px;font-size:12px;margin-bottom:15px;
 display:none
}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>

<body>

<div class="signup">

<div class="logo">CloudFlow</div>

<h1>Create Account</h1>
<p class="subtitle">
Start your free SaaS workspace today.
</p>

<div id="success" class="success">
Account created successfully!
</div>

<form id="signupForm">

<label>Full Name</label>
<input id="name" type="text" placeholder="John Doe" required>

<label>Email Address</label>
<input id="email" type="email" placeholder="john@example.com" required>

<label>Password</label>
<input id="password" type="password" placeholder="Create a password" required>

<div class="password-meter">
<div class="meter" id="meter"></div>
</div>

<div id="passwordError" class="error"></div>

<label>Confirm Password</label>
<input id="confirm" type="password" placeholder="Confirm password" required>

<div class="terms">
<input type="checkbox" id="terms" required>
<span>
I agree to the terms and conditions.
</span>
</div>

<button type="submit">Create Account</button>

</form>

<p class="login">
Already have an account?
<a href="#">Sign in</a>
</p>

</div>

<script>
const password=document.getElementById("password");
const meter=document.getElementById("meter");
const error=document.getElementById("passwordError");

password.addEventListener("input",()=>{
 const value=password.value;
 let strength=0;

 if(value.length>=6) strength++;
 if(/[A-Z]/.test(value)) strength++;
 if(/[0-9]/.test(value)) strength++;
 if(/[^A-Za-z0-9]/.test(value)) strength++;

 meter.style.width=(strength*25)+"%";

 if(value.length<6){
  error.textContent="Use at least 6 characters.";
 }else{
  error.textContent="";
 }
});

document.getElementById("signupForm").onsubmit=e=>{
 e.preventDefault();

 const pass=password.value;
 const confirm=document.getElementById("confirm").value;

 if(pass.length<6){
  error.textContent="Password must contain at least 6 characters.";
  return;
 }

 if(pass!==confirm){
  error.textContent="Passwords do not match.";
  return;
 }

 error.textContent="";

 document.getElementById("success").style.display="block";

 e.target.reset();
 meter.style.width="0%";
};
</script>

</body>
</html>

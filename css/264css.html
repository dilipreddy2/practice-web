<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS Invoice Management</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f6f8fb;color:#1e293b}
.wrap{max-width:1050px;margin:auto;padding:30px}
.top{display:flex;justify-content:space-between;align-items:center}
.btn{background:#2563eb;color:white;border:0;padding:10px 18px;border-radius:7px}
.table{margin-top:25px;background:white;border-radius:12px;overflow:auto;box-shadow:0 4px 15px #0001}
table{width:100%;border-collapse:collapse}
th,td{padding:16px;text-align:left;border-bottom:1px solid #eee}
.paid{color:#16a34a}.pending{color:#d97706}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div><h1>Invoice Management</h1><p>View and manage your invoices.</p></div>
<button class="btn">Create Invoice</button>
</div>
<div class="table">
<table>
<tr><th>Invoice</th><th>Date</th><th>Customer</th><th>Amount</th><th>Status</th></tr>
<tr><td>#INV-1001</td><td>Sep 15</td><td>Acme Corp</td><td>$490</td><td class="paid">Paid</td></tr>
<tr><td>#INV-1002</td><td>Sep 18</td><td>Nova Ltd</td><td>$720</td><td class="pending">Pending</td></tr>
<tr><td>#INV-1003</td><td>Sep 20</td><td>TechSoft</td><td>$350</td><td class="paid">Paid</td></tr>
</table>
</div>
</div>
</body>
</html>

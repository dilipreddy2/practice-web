<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS Integrations Page</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f6f8fc;color:#1f2937}
.wrap{max-width:1100px;margin:auto;padding:30px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}
.card{background:white;padding:22px;border-radius:13px;box-shadow:0 4px 15px #0001}
.icon{font-size:35px}
.connected{color:#16a34a;font-size:14px}
.btn{padding:9px 16px;border:0;border-radius:7px;background:#2563eb;color:white}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>
<body>
<div class="wrap">
<h1>Integrations</h1>
<p>Connect your favorite tools with CloudFlow.</p>
<div class="grid">
<div class="card"><div class="icon">💬</div><h2>Slack</h2><p>Receive notifications and collaborate with your team.</p><p class="connected">● Connected</p><button class="btn">Manage</button></div>
<div class="card"><div class="icon">📧</div><h2>Gmail</h2><p>Connect email workflows to your workspace.</p><p>Not connected</p><button class="btn">Connect</button></div>
<div class="card"><div class="icon">📅</div><h2>Google Calendar</h2><p>Sync meetings and scheduled activities.</p><p>Not connected</p><button class="btn">Connect</button></div>
</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Complete Analytics Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}
.wrap{max-width:1200px;margin:auto;padding:25px}
header{display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 14px #0001}
.num{font-size:28px;font-weight:bold;margin-top:8px}
.dashboard{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.chart{height:300px;display:flex;align-items:end;gap:10px}
.bar{flex:1;background:#4f46e5;border-radius:5px 5px 0 0}
.progress{height:10px;background:#e5e7eb;border-radius:10px;margin:10px 0}
.fill{height:100%;background:#4f46e5;border-radius:10px}
@media(max-width:750px){
.stats{grid-template-columns:repeat(2,1fr)}
.dashboard{grid-template-columns:1fr}
}
@media(max-width:450px){.stats{grid-template-columns:1fr}}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1>Analytics Overview</h1><p>Monitor your business performance.</p></div>
<select><option>Last 30 Days</option><option>Last 7 Days</option></select>
</header>
<div class="stats">
<div class="card">Visitors<div class="num">84.2K</div></div>
<div class="card">Conversions<div class="num">6.8K</div></div>
<div class="card">Revenue<div class="num">$92K</div></div>
<div class="card">Conversion Rate<div class="num">8.1%</div></div>
</div>
<div class="dashboard">
<div class="card">
<h2>Traffic Analytics</h2>
<div class="chart">
<div class="bar" style="height:40%"></div>
<div class="bar" style="height:60%"></div>
<div class="bar" style="height:48%"></div>
<div class="bar" style="height:75%"></div>
<div class="bar" style="height:65%"></div>
<div class="bar" style="height:88%"></div>
<div class="bar" style="height:78%"></div>
</div>
</div>
<div class="card">
<h2>Channels</h2>
<p>Organic</p><div class="progress"><div class="fill" style="width:78%"></div></div>
<p>Social</p><div class="progress"><div class="fill" style="width:55%"></div></div>
<p>Direct</p><div class="progress"><div class="fill" style="width:64%"></div></div>
</div>
</div>
</div>
</body>
</html>

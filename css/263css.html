<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS Checkout Page</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fb;color:#1f2937}
.wrap{max-width:950px;margin:40px auto;padding:20px}
.checkout{display:grid;grid-template-columns:1.5fr 1fr;gap:25px}
.card{background:white;padding:25px;border-radius:13px;box-shadow:0 4px 15px #0001}
label{display:block;margin:14px 0 6px;font-weight:bold}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:7px}
.pay{width:100%;margin-top:20px;padding:13px;background:#2563eb;color:white;border:0;border-radius:8px}
.summary{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}
@media(max-width:700px){.checkout{grid-template-columns:1fr}}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>
<body>
<div class="wrap">
<h1>Checkout</h1>
<div class="checkout">
<div class="card">
<h2>Payment Details</h2>
<label>Name on Card</label><input placeholder="John Doe">
<label>Card Number</label><input placeholder="1234 5678 9012 3456">
<label>Expiry Date</label><input placeholder="MM/YY">
<label>CVV</label><input placeholder="123">
<button class="pay">Pay $49.00</button>
</div>
<div class="card">
<h2>Order Summary</h2>
<div class="summary"><span>Professional Plan</span><b>$49</b></div>
<div class="summary"><span>Tax</span><b>$0</b></div>
<div class="summary"><span>Total</span><b>$49</b></div>
</div>
</div>
</div>
</body>
</html>

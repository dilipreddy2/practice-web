<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SaaS User Management System</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7fa;color:#1f2937}
.wrap{max-width:1100px;margin:auto;padding:25px}
header{display:flex;justify-content:space-between;align-items:center}
.btn{background:#2563eb;color:#fff;border:0;padding:10px 18px;border-radius:7px}
.table{background:#fff;margin-top:25px;border-radius:12px;overflow:auto;box-shadow:0 3px 15px #0001}
table{width:100%;border-collapse:collapse}
th,td{padding:16px;text-align:left;border-bottom:1px solid #eee}
th{background:#f8fafc}
.user{display:flex;gap:10px;align-items:center}
.avatar{width:38px;height:38px;border-radius:50%;background:#dbeafe;display:grid;place-items:center}
.active{color:#16a34a}.admin{color:#7c3aed}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>User Management</h1><p>Manage users and their access.</p></div><button class="btn">Add User</button></header>
<div class="table">
<table>
<tr><th>User</th><th>Role</th><th>Status</th><th>Last Active</th><th>Action</th></tr>
<tr><td><div class="user"><div class="avatar">AS</div>Aarav Sharma</div></td><td class="admin">Admin</td><td class="active">Active</td><td>Today</td><td>⋮</td></tr>
<tr><td><div class="user"><div class="avatar">PR</div>Priya Rao</div></td><td>Editor</td><td class="active">Active</td><td>Yesterday</td><td>⋮</td></tr>
<tr><td><div class="user"><div class="avatar">RK</div>Rahul Kumar</div></td><td>Viewer</td><td>Inactive</td><td>3 days ago</td><td>⋮</td></tr>
</table>
</div>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>CSS Object Fit and Position</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .box {
            width: 250px;
            height: 200px;
            border: 3px solid blue;
        }

        img {
            width: 100%;
            height: 100%;
        }

        .cover {
            object-fit: cover;
        }

        .contain {
            object-fit: contain;
            background-color: white;
        }

        .fill {
            object-fit: fill;
        }

        .position {
            object-fit: cover;
            object-position: top;
        }
    </style>
<style id="cloudflow-theme">:root{--text:#eef2ff;--muted:#a8b3cf;--accent:#7c5cff;--accent2:#22d3ee;--border:#2a3655}html{scroll-behavior:smooth}body{background:linear-gradient(135deg,#080c18,#101a31)!important;color:var(--text)!important;font-family:Inter,Segoe UI,Arial,sans-serif!important;line-height:1.6}h1,h2,h3,h4,h5,h6{color:var(--text)}p,li,label,small{color:var(--muted)}a{color:var(--accent2)}nav,.navbar,.top,header{background:rgba(8,12,24,.94)!important;color:var(--text)!important;border-color:var(--border)!important;backdrop-filter:blur(10px)}.logo{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text!important;-webkit-text-fill-color:transparent!important;color:var(--accent2)}button,.btn,.button,input[type=submit],input[type=button]{border-radius:10px;transition:.25s}button:hover,.btn:hover,.button:hover,input[type=submit]:hover,input[type=button]:hover{transform:translateY(-2px)}.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,.panel,.box,.content-box,.form-container,.contact-form,.profile-card,.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,.modal-content,.container-card,.plan,.table-container{background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;color:var(--text)!important;border-color:var(--border)!important;box-shadow:0 14px 35px rgba(0,0,0,.22)}input,textarea,select{background:#0e1528!important;color:var(--text)!important;border:1px solid var(--border)!important;border-radius:8px}input::placeholder,textarea::placeholder{color:#71809f}table{border-color:var(--border)!important}th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}img{max-width:100%}.badge,.tag,.label{border-radius:999px}@media(max-width:700px){body{overflow-x:hidden}}</style>
</head>

<body>

    <h1>CSS Object-Fit and Object-Position</h1>

    <div class="container">

        <div>
            <h3>Object Fit: Cover</h3>
            <div class="box">
                <img src="https://picsum.photos/id/1015/500/300"
                     class="cover"
                     alt="Cover Image">
            </div>
        </div>

        <div>
            <h3>Object Fit: Contain</h3>
            <div class="box">
                <img src="https://picsum.photos/id/1015/500/300"
                     class="contain"
                     alt="Contain Image">
            </div>
        </div>

        <div>
            <h3>Object Fit: Fill</h3>
            <div class="box">
                <img src="https://picsum.photos/id/1015/500/300"
                     class="fill"
                     alt="Fill Image">
            </div>
        </div>

        <div>
            <h3>Object Position: Top</h3>
            <div class="box">
                <img src="https://picsum.photos/id/1015/500/300"
                     class="position"
                     alt="Top Position Image">
            </div>
        </div>

    </div>

</body>
</html>

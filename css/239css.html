<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>User Profile Menu</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f1f5f9}
header{
 height:70px;background:white;border-bottom:1px solid #e5e7eb;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 6%
}
.profile{
 display:flex;align-items:center;gap:10px;cursor:pointer
}
.avatar{
 width:40px;height:40px;border-radius:50%;
 background:#2563eb;color:white;
 display:flex;align-items:center;justify-content:center;
 font-weight:bold
}
.menu{
 position:absolute;right:6%;top:62px;width:230px;
 background:white;border:1px solid #e5e7eb;
 border-radius:10px;box-shadow:0 15px 35px #0002;
 display:none;overflow:hidden
}
.menu.show{display:block}
.user-info{padding:16px;border-bottom:1px solid #e5e7eb}
.user-info strong{display:block}
.user-info span{font-size:12px;color:#64748b}
.menu a{
 display:block;padding:13px 16px;text-decoration:none;
 color:#374151;font-size:13px
}
.menu a:hover{background:#f1f5f9}
.logout{color:#dc2626!important}
main{padding:50px 6%}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>

<body>

<header>

<h2>CloudFlow</h2>

<div class="profile" id="profile">
<div class="avatar">JD</div>
<span>John Doe ▾</span>
</div>

<div class="menu" id="menu">

<div class="user-info">
<strong>John Doe</strong>
<span>john@example.com</span>
</div>

<a href="#">My Profile</a>
<a href="#">Account Settings</a>
<a href="#">Billing</a>
<a href="#">Help Center</a>
<a href="#" class="logout">Sign Out</a>

</div>

</header>

<main>
<h1>Dashboard</h1>
<p>Welcome back, John.</p>
</main>

<script>
const profile=document.getElementById("profile");
const menu=document.getElementById("menu");

profile.onclick=()=>{
 menu.classList.toggle("show");
};

document.addEventListener("click",e=>{
 if(!profile.contains(e.target)&&!menu.contains(e.target)){
  menu.classList.remove("show");
 }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Progress Bar Component</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background-color: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #172554;
            text-align: center;
            margin-bottom: 12px;
        }

        .description {
            color: #64748b;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .progress-section {
            padding: 30px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .progress-title {
            color: #334155;
            font-weight: bold;
        }

        .progress-value {
            color: #2563eb;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 18px;
            background-color: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            width: 75%;
            height: 100%;
            background-color: #2563eb;
            border-radius: 20px;
            animation: progressAnimation 2s ease-in-out;
        }

        @keyframes progressAnimation {
            from {
                width: 0;
            }

            to {
                width: 75%;
            }
        }

        .progress-info {
            margin-top: 15px;
            color: #64748b;
            font-size: 14px;
        }

        .examples {
            margin-top: 30px;
        }

        .example {
            margin-bottom: 20px;
        }

        .example-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #334155;
            font-size: 14px;
        }

        .small-progress-bar {
            width: 100%;
            height: 10px;
            background-color: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
        }

        .small-progress {
            height: 100%;
            border-radius: 20px;
        }

        .progress-one {
            width: 40%;
            background-color: #f59e0b;
        }

        .progress-two {
            width: 60%;
            background-color: #16a34a;
        }

        .progress-three {
            width: 90%;
            background-color: #7c3aed;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 20px;
            }

            .progress-section {
                padding: 22px;
            }
        }
    </style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>

<body>

    <div class="container">

        <h1>Progress Bar Component</h1>

        <p class="description">
            A progress bar visually represents the completion
            percentage of a task or process.
        </p>

        <div class="progress-section">

            <div class="progress-header">
                <span class="progress-title">Project Progress</span>
                <span class="progress-value">75%</span>
            </div>

            <div class="progress-bar">
                <div class="progress"></div>
            </div>

            <p class="progress-info">
                The project is 75% completed.
            </p>

            <div class="examples">

                <div class="example">
                    <div class="example-header">
                        <span>Download</span>
                        <span>40%</span>
                    </div>

                    <div class="small-progress-bar">
                        <div class="small-progress progress-one"></div>
                    </div>
                </div>

                <div class="example">
                    <div class="example-header">
                        <span>Installation</span>
                        <span>60%</span>
                    </div>

                    <div class="small-progress-bar">
                        <div class="small-progress progress-two"></div>
                    </div>
                </div>

                <div class="example">
                    <div class="example-header">
                        <span>Final Review</span>
                        <span>90%</span>
                    </div>

                    <div class="small-progress-bar">
                        <div class="small-progress progress-three"></div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Calendar & Scheduling</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f5f7fb;color:#111827}
.container{width:94%;max-width:1100px;margin:35px auto}
.header{
 display:flex;justify-content:space-between;align-items:center;
 margin-bottom:20px
}
button{
 border:0;background:#2563eb;color:white;
 padding:10px 15px;border-radius:7px;cursor:pointer
}
.calendar{
 background:white;border:1px solid #e5e7eb;
 border-radius:12px;overflow:hidden
}
.days,.dates{
 display:grid;grid-template-columns:repeat(7,1fr)
}
.day{
 padding:15px;text-align:center;font-size:12px;
 color:#64748b;border-bottom:1px solid #e5e7eb
}
.date{
 min-height:100px;padding:10px;border-right:1px solid #e5e7eb;
 border-bottom:1px solid #e5e7eb
}
.date strong{font-size:12px}
.event{
 background:#dbeafe;color:#1d4ed8;
 padding:5px;margin-top:8px;border-radius:4px;
 font-size:10px
}
.today{
 background:#eff6ff
}
@media(max-width:650px){
 .date{min-height:70px;padding:5px}
 .event{font-size:8px}
 .day{padding:8px 2px}
}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>

<body>

<main class="container">

<div class="header">
<h1>September 2026</h1>
<button onclick="addEvent()">+ Add Event</button>
</div>

<div class="calendar">

<div class="days">
<div class="day">Sun</div>
<div class="day">Mon</div>
<div class="day">Tue</div>
<div class="day">Wed</div>
<div class="day">Thu</div>
<div class="day">Fri</div>
<div class="day">Sat</div>
</div>

<div class="dates">

<div class="date"></div><div class="date"></div>
<div class="date">1</div>
<div class="date">2</div>
<div class="date">3</div>
<div class="date">4</div>
<div class="date">5</div>

<div class="date">6</div>
<div class="date">7<div class="event">Team Meeting</div></div>
<div class="date">8</div>
<div class="date">9</div>
<div class="date">10<div class="event">Demo</div></div>
<div class="date">11</div>
<div class="date">12</div>

<div class="date">13</div>
<div class="date">14</div>
<div class="date today"><strong>15</strong><div class="event">Planning</div></div>
<div class="date">16</div>
<div class="date">17</div>
<div class="date">18</div>
<div class="date">19</div>

<div class="date">20</div>
<div class="date">21</div>
<div class="date">22</div>
<div class="date">23</div>
<div class="date">24</div>
<div class="date">25</div>
<div class="date">26</div>

<div class="date">27</div>
<div class="date">28</div>
<div class="date">29</div>
<div class="date">30</div>

</div>
</div>

</main>

<script>
function addEvent(){
 const name=prompt("Enter event name:");

 if(name){
  alert("Event \""+name+"\" created.");
 }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Command Palette</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f1f5f9;color:#111827}
header{
 background:#111827;color:white;padding:20px 6%;
 display:flex;justify-content:space-between
}
.container{width:90%;max-width:1000px;margin:40px auto}
.card{background:white;padding:30px;border-radius:12px}
.palette{
 position:fixed;inset:0;background:rgba(15,23,42,.65);
 display:none;align-items:flex-start;justify-content:center;
 padding-top:12vh
}
.palette.show{display:flex}
.box{
 background:white;width:min(600px,90%);
 border-radius:12px;overflow:hidden;
 box-shadow:0 25px 60px rgba(0,0,0,.25)
}
.search{
 width:100%;padding:18px;border:0;
 border-bottom:1px solid #e5e7eb;outline:0;font-size:16px
}
.command{
 padding:15px 18px;cursor:pointer;display:flex;
 justify-content:space-between
}
.command:hover,.command.active{background:#eff6ff}
kbd{
 background:#e5e7eb;padding:3px 7px;border-radius:4px;
 font-size:11px
}
button{
 background:#2563eb;color:white;border:0;padding:10px 15px;
 border-radius:7px;cursor:pointer
}
</style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>

<body>

<header>
<h2>CloudFlow</h2>
<button onclick="openPalette()">Search</button>
</header>

<main class="container">
<div class="card">
<h1>Dashboard</h1>
<br>
<p>Press <b>Ctrl + K</b> to open the command palette.</p>
</div>
</main>

<div class="palette" id="palette">
<div class="box">

<input
 id="search"
 class="search"
 placeholder="Search commands..."
>

<div id="commands">

<div class="command">
<span>Go to Dashboard</span><kbd>1</kbd>
</div>

<div class="command">
<span>Open Projects</span><kbd>2</kbd>
</div>

<div class="command">
<span>View Analytics</span><kbd>3</kbd>
</div>

<div class="command">
<span>Open Settings</span><kbd>4</kbd>
</div>

</div>
</div>
</div>

<script>
const palette=document.getElementById("palette");
const search=document.getElementById("search");

function openPalette(){
 palette.classList.add("show");
 search.focus();
}

function closePalette(){
 palette.classList.remove("show");
}

document.addEventListener("keydown",e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){
  e.preventDefault();
  openPalette();
 }

 if(e.key==="Escape") closePalette();
});

search.addEventListener("input",()=>{
 const value=search.value.toLowerCase();

 document.querySelectorAll(".command").forEach(item=>{
  item.style.display=
   item.textContent.toLowerCase().includes(value)
   ?"flex":"none";
 });
});

palette.addEventListener("click",e=>{
 if(e.target===palette) closePalette();
});

document.querySelectorAll(".command").forEach(item=>{
 item.onclick=()=>{
  alert("Selected: "+item.innerText);
  closePalette();
 };
});
</script>

</body>
</html>

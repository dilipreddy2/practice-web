<!DOCTYPE html>
<html>
<head>
    <title>Analytics Date-Range Filter</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:Arial,sans-serif; background:#f1f5f9; color:#1e293b; }
        .page { max-width:1100px; margin:auto; padding:30px; }
        header { background:#0f172a; color:white; padding:25px; border-radius:12px; margin-bottom:25px; }
        header h1 { margin-bottom:8px; }
        header p { color:#cbd5e1; }
        .card,.report,.response,.contentcard,.search,.results,.promptbox,.suggestions,.autocomplete,.command,.chat,.form,.donuts,.heatmap,.funnel { background:white; padding:25px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
        .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; }
        .card h2 { margin:10px 0; }
        button { border:0; background:#2563eb; color:white; padding:11px 16px; border-radius:7px; cursor:pointer; }
        button:hover { background:#1d4ed8; }
        .funnel { display:flex; flex-direction:column; align-items:center; gap:10px; }
        .stage { color:white; padding:20px; text-align:center; border-radius:8px; }
        .stage span { display:block; margin-top:5px; }
        .s1{background:#1e3a8a;width:100%} .s2{background:#2563eb;width:80%} .s3{background:#3b82f6;width:60%} .s4{background:#60a5fa;width:40%}
        .chart { height:280px; display:flex; align-items:flex-end; gap:12px; padding:20px; border-left:1px solid #cbd5e1; border-bottom:1px solid #cbd5e1; }
        .form{display:grid;gap:18px;max-width:600px}.form label{display:grid;gap:8px;font-weight:bold}.form input,.form select{padding:12px;border:1px solid #cbd5e1;border-radius:8px}.form button{width:max-content}
        @media(max-width:800px) { .grid{grid-template-columns:repeat(2,1fr)} .donuts{flex-direction:column} }
        @media(max-width:550px) { .page{padding:15px} .grid{grid-template-columns:1fr} .chart{gap:5px} }
    </style>

<style>
:root{
 --bg:#0b1020;
 --panel:#11182b;
 --panel2:#0e1528;
 --text:#eef2ff;
 --muted:#a8b3cf;
 --accent:#7c5cff;
 --accent2:#22d3ee;
 --ok:#34d399;
 --danger:#fb7185;
 --border:#2a3655;
}
html{scroll-behavior:smooth}
body{
 background:linear-gradient(135deg,#080c18,#101a31)!important;
 color:var(--text)!important;
 font-family:Inter,Segoe UI,Arial,sans-serif!important;
 line-height:1.6;
}
h1,h2,h3,h4,h5,h6{color:var(--text)}
p,li,label,small{color:var(--muted)}
a{color:var(--accent2);transition:.25s}
a:hover{color:#fff}
nav,.navbar,.top,header{
 background:rgba(8,12,24,.94)!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 backdrop-filter:blur(10px);
}
.logo{
 background:linear-gradient(90deg,var(--accent),var(--accent2));
 -webkit-background-clip:text!important;
 -webkit-text-fill-color:transparent!important;
 color:var(--accent2);
}
button,.btn,.button,input[type="submit"],input[type="button"]{
 border-radius:10px;
 transition:transform .25s,box-shadow .25s,background .25s;
}
button:hover,.btn:hover,.button:hover,input[type="submit"]:hover,input[type="button"]:hover{
 transform:translateY(-2px);
}
.card,.feature-card,.product-card,.pricing-card,.testimonial,.hero-image,
.panel,.box,.content-box,.form-container,.contact-form,.profile-card,
.saas-card,.dashboard-card,.stat-card,.service-card,.info-card,.review-card,
.modal-content,.container-card,.plan,.table-container{
 background:linear-gradient(145deg,rgba(17,24,43,.96),rgba(14,21,40,.96))!important;
 color:var(--text)!important;
 border-color:var(--border)!important;
 box-shadow:0 14px 35px rgba(0,0,0,.22);
}
input,textarea,select{
 background:#0e1528!important;
 color:var(--text)!important;
 border:1px solid var(--border)!important;
 border-radius:8px;
}
input::placeholder,textarea::placeholder{color:#71809f}
table{border-color:var(--border)!important}
th{background:rgba(124,92,255,.18)!important;color:var(--text)!important}
td{background:rgba(17,24,43,.8)!important;color:var(--muted)!important;border-color:var(--border)!important}
img{max-width:100%}
.badge,.tag,.label{
 border-radius:999px;
}
@media(max-width:700px){
 body{overflow-x:hidden}
}
</style>
</head>
<body>
    <main class="page">
        <header>
            <h1>Analytics Date-Range Filter</h1>
            <p>A date-range filter component for analytics dashboards.</p>
        </header>
        
        <div class="form">
            <label>Start Date<input type="date" value="2026-09-01"></label>
            <label>End Date<input type="date" value="2026-09-17"></label>
            <button>Apply Filter</button>
        </div>
    </main>
</body>
</html>
